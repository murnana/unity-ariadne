name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # 手動実行: インストーラー(MSI / pkg)をビルドして Artifact としてアップロードするだけ。
  # GitHub Release の作成・更新は行わない(タグ push のときだけ行う)。
  workflow_dispatch:
    inputs:
      version:
        description: 'インストーラーに埋め込むバージョン(例: 1.2.3 / 1.2.3-rc1)'
        required: false
        default: '0.0.0-dev'
        type: string

# -----------------------------------------------------------------------------
# ワークフローレベルの権限
# -----------------------------------------------------------------------------
# デフォルトですべての権限を無効化し、ジョブごとに必要な権限のみ付与します。
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  # plugin.json の version がタグと一致しているか検証する。
  # 外部 marketplace がこのタグ(または添付 zip)を参照するため、ずれると別バージョンを配ってしまう。
  verify-plugin-version:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check plugin.json version matches the tag
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(jq -r .version claude-plugins/.claude-plugin/plugin.json)"
          if [ "$actual" != "$expected" ]; then
            echo "::error file=claude-plugins/.claude-plugin/plugin.json::version ($actual) がタグ ($expected) と一致しません。plugin.json の version を更新してから、タグを打ち直してください。"
            exit 1
          fi

  verify-build:
    if: github.ref_type == 'tag'
    needs: verify-plugin-version
    strategy:
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build src/Analyzer (pulls in src/Graph as a project reference)
        run: dotnet build src/Analyzer/UnityAriadne.Analyzer.csproj --configuration Release
      - name: Smoke test (exercises the native SQLite path end to end)
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/smoke-project"
          db="$RUNNER_TEMP/smoke.db"
          mkdir -p "$project/Assets"
          dotnet run --no-build --project src/Analyzer --configuration Release -- analyze "$project" --db "$db"
          dotnet run --no-build --project src/Analyzer --configuration Release -- report --db "$db"

  package-and-release:
    if: github.ref_type == 'tag'
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Package source zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$RUNNER_TEMP/unity-ariadne-${version}"
          mkdir -p "$staging/src"
          cp -R src/Analyzer src/Graph "$staging/src/"
          cp LICENSE THIRD-PARTY-NOTICES.md installer/NOTICE.txt "$staging/"
          # bin/obj are gitignored and never present in a fresh checkout, but strip them
          # defensively in case a future workflow change builds before packaging.
          find "$staging" -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +

          # Stamp the tag version onto both projects at once (Directory.Build.props is
          # auto-imported by every csproj under this directory) so a plain `dotnet build`/
          # `dotnet run` on the recipient's machine produces an assembly whose
          # AssemblyVersion/InformationalVersion match the release tag, with no extra flags
          # needed. Not committed to the repo — generated only at packaging time, so normal
          # dev builds from a git checkout are unaffected.
          cat > "$staging/src/Directory.Build.props" <<EOF
          <Project>
            <PropertyGroup>
              <Version>${version}</Version>
            </PropertyGroup>
          </Project>
          EOF

          sed \
            -e "s|{{VERSION}}|${GITHUB_REF_NAME}|g" \
            -e "s|{{DOCS_URL}}|https://github.com/${GITHUB_REPOSITORY}/tree/main/docs/manual|g" \
            .github/release-usage-template.md > "$staging/USAGE.md"

      - name: Verify the staged (version-stamped) zip contents actually build
        run: dotnet build "$RUNNER_TEMP/unity-ariadne-${GITHUB_REF_NAME#v}/src/Analyzer/UnityAriadne.Analyzer.csproj" --configuration Release

      - name: Zip
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$RUNNER_TEMP/unity-ariadne-${version}"
          find "$staging" -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} +
          mkdir -p dist
          (cd "$RUNNER_TEMP" && zip -r "$OLDPWD/dist/unity-ariadne-${version}-src.zip" "unity-ariadne-${version}")

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*.zip
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  # インストーラー(self-contained のため利用者に .NET SDK/ランタイムは不要)
  # タグ push と手動実行(workflow_dispatch)のときだけビルドし、Artifact としてアップロードします。
  # タグ push のときは、さらに publish-installers が package-and-release の作成した
  # GitHub Release(リリースページ)へも添付します。
  # どちらも未署名です(docs/development/release.md 参照)。
  # ---------------------------------------------------------------------------
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # タグ push のときはタグ名、手動実行のときは入力値。先頭の v は取り除く。
      RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build MSI
        shell: pwsh
        run: ./installer/windows/build.ps1 -Version "$($env:RAW_VERSION.TrimStart('v'))" -OutDir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-msi
          path: dist/*.msi
          if-no-files-found: error

  build-pkg:
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      RAW_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build pkg
        run: ./installer/macos/build-pkg.sh osx-arm64 "${RAW_VERSION#v}" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-pkg
          path: dist/*.pkg
          if-no-files-found: error

  # タグ push のときだけ、ビルド済みインストーラーを GitHub Release へ添付する。
  # Release は package-and-release が同じ実行内で作成済み。
  publish-installers:
    if: github.ref_type == 'tag'
    needs: [package-and-release, build-msi, build-pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installer-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.msi
            dist/*.pkg

  # ---------------------------------------------------------------------------
  # Claude Code プラグイン zip
  # 外部 marketplace(murnana/murnana-claude-code-plugin)の `archive` ソースから参照します:
  #   { "source": "archive", "url": "<zip の URL>", "sha256": "<.sha256 ファイルの値>" }
  # zip のルート直下にプラグイン本体(.claude-plugin/ と .mcp.json)を置きます。
  # ---------------------------------------------------------------------------
  build-plugin:
    if: github.ref_type == 'tag'
    needs: package-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package plugin
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="$RUNNER_TEMP/plugin"
          mkdir -p "$staging" dist
          cp -R claude-plugins/. "$staging/"
          cp LICENSE "$staging/"
          zip_name="unity-ariadne-${version}-claude-plugin.zip"
          (cd "$staging" && zip -r -X "$GITHUB_WORKSPACE/dist/$zip_name" .)
          (cd dist && sha256sum "$zip_name" | awk '{print $1}' > "$zip_name.sha256")
          {
            echo "### Claude Code plugin"
            echo
            echo "- zip: \`$zip_name\`"
            echo "- sha256: \`$(cat "dist/$zip_name.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*-claude-plugin.zip
            dist/*-claude-plugin.zip.sha256
