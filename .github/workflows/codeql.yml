name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: '17 3 * * 1' # 毎週月曜 03:17 UTC

# -----------------------------------------------------------------------------
# ワークフローレベルの権限
# -----------------------------------------------------------------------------
# デフォルトですべての権限を無効化し、ジョブごとに必要な権限のみ付与します。
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 10.0.x
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build
        if: matrix.language == 'csharp'
        run: dotnet build UnityAriadne.slnx --configuration Release
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
